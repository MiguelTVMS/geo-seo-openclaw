name: Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "geo/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "references/**"
      - "*.json"
      - "*.mjs"
      - "*.md"
      - ".github/workflows/*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        id: tests
        run: npm test

      - name: Check AI instruction symlinks
        id: symlinks
        run: |
          FAIL=0
          for link in .github/copilot-instructions.md; do
            if [ ! -L "$link" ]; then
              echo "❌ $link is missing or not a symlink"
              FAIL=1
            else
              target=$(readlink "$link")
              resolved=$(realpath "$link" 2>/dev/null || true)
              if [ ! -f "$resolved" ]; then
                echo "❌ $link -> $target (broken — target does not exist)"
                FAIL=1
              else
                echo "✅ $link -> $target"
              fi
            fi
          done
          exit $FAIL

      - name: Post CI summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const steps = {
              tests:    '${{ steps.tests.outcome }}',
              symlinks: '${{ steps.symlinks.outcome }}',
            };

            const icon = (outcome) =>
              outcome === 'success' ? '✅' : outcome === 'skipped' ? '⏭️' : '❌';

            const allPassed = Object.values(steps).every(o => o === 'success' || o === 'skipped');
            const headline = allPassed ? '## ✅ All checks passed' : '## ❌ Some checks failed';

            const body = `${headline}

            | Check | Result |
            |-------|--------|
            | Tests | ${icon(steps.tests)} ${steps.tests} |
            | AI instruction symlinks | ${icon(steps.symlinks)} ${steps.symlinks} |

            <sub>🤖 Posted by CI · ${new Date().toUTCString()}</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🤖 Posted by CI')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
